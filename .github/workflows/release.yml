name: Stable Windows Release
on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: 'Release track: "manual-initial" (Unsigned manual download v1.2.0) or "signed-auto-update" (Signed production release with full auto-update)'
        required: true
        default: 'manual-initial'
        type: choice
        options:
          - manual-initial
          - signed-auto-update

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify release mode, version, and tag commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $mode = "${{ github.event.inputs.release_mode }}"
          if ($mode -eq 'manual-initial') {
            if ($version -ne '1.2.0') {
              throw "manual-initial track is strictly restricted to v1.2.0. Version $version requires signed-auto-update track."
            }
          }
          $targetTag = "v$version"
          $tagCommit = (git rev-list -n 1 "$targetTag" 2>$null)
          if (-not $tagCommit) {
            throw "Release blocked: Git tag $targetTag does not exist in repository."
          }
          $headCommit = (git rev-parse HEAD)
          if ($tagCommit -ne $headCommit) {
            throw "Release blocked: Build commit $headCommit does not match tag $targetTag ($tagCommit)."
          }
          Write-Host "Verified git tag $targetTag exists and exactly matches HEAD commit ($headCommit)."

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Secret scan
        run: node test/secrets-scan.cjs

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Enforce signing gates for signed auto-update track
        if: ${{ github.event.inputs.release_mode == 'signed-auto-update' }}
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_P12 }}
          WINDOWS_CERTIFICATE_PUBLISHER: ${{ secrets.WINDOWS_CERTIFICATE_PUBLISHER }}
          ELECTRON_BUILDER_UPDATE_SIGN_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          $builderMajor = [int]((node -p "require('electron-builder/package.json').version").Split('.')[0])
          $updaterMajor = [int]((node -p "require('electron-updater/package.json').version").Split('.')[0])
          if ($builderMajor -lt 27 -or $updaterMajor -lt 7) {
            throw "Signed auto-update track blocked: Signed Update Manifests require verified electron-builder 27 and electron-updater 7 migration. Current versions: builder v$builderMajor, updater v$updaterMajor. Automated in-app update releases remain blocked until manifest signing is finalized."
          }
          if (-not $env:CSC_LINK -or -not $env:WINDOWS_CERTIFICATE_PUBLISHER -or -not $env:ELECTRON_BUILDER_UPDATE_SIGN_KEY) {
            throw 'Signed auto-update track blocked: Windows code signing certificate, publisher identity, and ELECTRON_BUILDER_UPDATE_SIGN_KEY are required.'
          }
          Write-Host "Code signing credentials and update key verified for publisher: $env:WINDOWS_CERTIFICATE_PUBLISHER"

      - name: Build Windows release assets
        run: npm run build:win -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_CERTIFICATE_PUBLISHER: ${{ secrets.WINDOWS_CERTIFICATE_PUBLISHER }}
          ELECTRON_BUILDER_UPDATE_SIGN_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_KEY }}

      - name: Verify release artifacts and metadata
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PUBLISHER: ${{ secrets.WINDOWS_CERTIFICATE_PUBLISHER }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @('release/latest.yml')
          if (-not (Test-Path $required[0])) { throw 'electron-builder did not generate latest.yml' }
          if (-not (Get-ChildItem release -Filter '*.blockmap' -File)) { throw 'NSIS blockmap missing' }
          if (-not (Get-ChildItem release -Filter 'Modawwan-Setup-*.exe' -File)) { throw 'NSIS installer missing' }
          if (-not (Get-ChildItem release -Filter 'Modawwan-Portable-*.exe' -File)) { throw 'Portable executable missing' }

          if ("${{ github.event.inputs.release_mode }}" -eq 'signed-auto-update') {
            $exe = (Get-ChildItem release -Filter 'Modawwan-Setup-*.exe' -File | Where-Object { $_.Name -ne 'Modawwan-Setup.exe' } | Select-Object -First 1).FullName
            $sig = Get-AuthenticodeSignature $exe
            if ($sig.Status -ne 'Valid') {
              throw "Windows Authenticode signature verification failed for $exe (Status: $($sig.Status))"
            }
            if ($sig.SignerCertificate.Subject -notmatch [regex]::Escape($env:WINDOWS_CERTIFICATE_PUBLISHER)) {
              throw "Signer Subject ($($sig.SignerCertificate.Subject)) does not match expected publisher ($env:WINDOWS_CERTIFICATE_PUBLISHER)"
            }
            Write-Host "Authenticode signature verified valid for: $($sig.SignerCertificate.Subject)"

            $manifest = Get-Content 'release/latest.yml' -Raw
            if ($manifest -notmatch '(?m)^signature:\s*.+') {
              throw "Update Manifest verification failed: latest.yml does not contain a verified Ed25519 signature block."
            }
            Write-Host "Update Manifest Ed25519 signature block verified in latest.yml."
          }

      - name: Publish verified release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $setup = (Get-ChildItem release -Filter 'Modawwan-Setup-*.exe' -File | Where-Object { $_.Name -ne 'Modawwan-Setup.exe' } | Select-Object -First 1).FullName
          Copy-Item $setup 'release/Modawwan-Setup.exe' -Force
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Name -match '^(Modawwan-Setup.*\.exe|Modawwan-Portable.*\.exe|latest\.yml|.*\.blockmap)$' } | ForEach-Object FullName)
          if ($assets.Count -lt 4) { throw 'Expected installer, portable EXE, latest.yml, and blockmap assets' }

          $existing = (& gh release view $tag --json tagName 2>&1)
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
            if ($LASTEXITCODE -ne 0) { throw "Asset upload failed for release $tag" }
            gh release edit $tag --draft=false --latest
            if ($LASTEXITCODE -ne 0) { throw "Failed to publish release $tag as latest stable" }
          } else {
            gh release create $tag @assets --title "$tag — Modawwan Productivity Suite" --notes-file CHANGELOG.md --latest
            if ($LASTEXITCODE -ne 0) { throw "Failed to create release $tag" }
          }
          Write-Host "Release $tag published and verified successfully!"

      - name: Activate direct download buttons in READMEs upon stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main

          $en = Get-Content README.md -Raw
          $ar = Get-Content README.ar.md -Raw
          $directUrl = "https://github.com/husseinezzat0/modawwan/releases/latest/download/Modawwan-Setup.exe"

          $en = $en.Replace('Download_for_Windows-Coming_Soon-orange', 'Download_for_Windows-Setup.exe-0078D6')
          $en = $en.Replace('First Stable Release Coming Soon', 'Offline-First')
          $en = $en -replace '(?s)<a href="https://github.com/husseinezzat0/modawwan/releases">\s*<img src="https://img.shields.io/badge/Download_for_Windows-Setup.exe-0078D6', "<a href=""$directUrl"">`n    <img src=""https://img.shields.io/badge/Download_for_Windows-Setup.exe-0078D6"

          $ar = $ar.Replace('تحميل_مُدَوَّن_لويندوز-متاح_قريبًا-orange', 'تحميل_مُدَوَّن_لويندوز-Setup.exe-0078D6')
          $ar = $ar.Replace('أول إصدار مستقر قادم قريبًا', 'يعمل بدون إنترنت')
          $ar = $ar -replace '(?s)<a href="https://github.com/husseinezzat0/modawwan/releases">\s*<img src="https://img.shields.io/badge/تحميل_مُدَوَّن_لويندوز-Setup.exe-0078D6', "<a href=""$directUrl"">`n    <img src=""https://img.shields.io/badge/تحميل_مُدَوَّن_لويندوز-Setup.exe-0078D6"

          Set-Content README.md -Value $en -NoNewline
          Set-Content README.ar.md -Value $ar -NoNewline

          git add README.md README.ar.md
          $diff = git diff --staged
          if ($diff) {
            git commit -m "docs: activate direct download badge in READMEs for published stable release"
            git push origin main
            if ($LASTEXITCODE -ne 0) {
              throw "CRITICAL PARTIAL STATE: Stable release was published, but pushing updated README badges to origin/main failed (Exit code: $LASTEXITCODE). Run manual reconciliation: git push origin main"
            }
            Write-Host "README download badges updated to live Setup.exe link."
          } else {
            Write-Host "README download badges already up to date."
          }
