name: Windows CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Secret scan
        run: node test/secrets-scan.cjs
      - name: Dependency audit
        run: npm audit --audit-level=high
      - name: Production build
        run: npm run build
      - name: Windows packaging verification
        run: npx electron-builder --win --x64 --dir
      - name: Verify packaged application
        shell: pwsh
        run: |
          $exe = 'release/win-unpacked/Modawwan.exe'
          if (-not (Test-Path $exe)) { throw "Packaged executable missing: $exe" }
          if ((Get-Item $exe).Length -lt 40MB) { throw 'Executable suspiciously small' }